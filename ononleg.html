<!DOCTYPE html>
<head>
  <title>ononleg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</head>
<body class="container">
  <h1>ononleg</h1>

  <table class="table">
    <thead>
      <tr>
        <th></th>
        <th>Start</th>
        <th>Leading tonight</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><b>D</b></td>
        <td>10</td>
        <td id="tonight-dem"></td>
      </tr>
      <tr>
        <td><b>R</b></td>
        <td>7</td>
        <td id="tonight-rep"></td>
      </tr>
    </tbody>
  </table>

  <script>
    $(document).ready(() => {
      const elex25Margins = {
        'D4': 'D+12.4',
        'D5': 'D+12.8',
        'D6': 'D+3.8',
        'D8': 'D+51.1',
        'D9': 'WOR+12.3',
        'D10': 'D+10.9'
      };

      const getResults = () => {
        return fetch('https://datawrapper.dwcdn.net/7ZkLR/')
          .then(r => r.text())
          .then((r) => {
            const currentVersionUrl = r.match(/<meta http-equiv="REFRESH" content="0; url=(.*)"/)[1];
            return Promise.resolve(`${currentVersionUrl}dataset.csv`);
          })
          .then(fetch)
          .then(r => r.text())
          .then(r => r.split("\n").slice(2))
          .then((lines) => {
            const indices = lines.reduce((acc, val, idx) => {
              if (val === '|Votes|Percent') acc.push(idx);
              return acc;
            }, []);

            return Promise.resolve(indices.map((index, indicesIndex) => {
              const endIndex = indicesIndex === indices.length - 1 ? lines.length : indices[indicesIndex + 1] - 1;
              const candidates = lines.slice(index + 1, endIndex).map((candidateResult) => {
                const candidateResultParts = candidateResult.split('|');
                return [ candidateResultParts[0], Number(candidateResultParts[1]), parseFloat(candidateResultParts[2]) ];
              });

              return {
                name: lines[index - 1].split('||')[0],
                candidates
              };
            }));
          })
          .then(contestsResults =>
            Promise.resolve(contestsResults.filter(r => r.name.includes('County Legislator '))));
      };

      const getContestsWithIds = () => {
        return fetch(`https://ongov.resultscaster.com/api/resultscasts/GE25-Official/shell`)
          .then(r => r.json())
          .then(r => Promise.resolve(r.contests.filter(c => c.title.includes('County Legislator '))))
          .then(contests => Promise.resolve(contests.map(c => [ c.title, c.contestAltTallyKey ])));
      };

      const getSameDayPrecinctsWithStatus = () => {
        return fetch('https://ongov.resultscaster.com/api/Resultscasts/GE25-Official/pdresults/In Person')
          .then(r => r.json())
          .then(r => r.contests);
      };

      const getSameDayPrecinctStatusesByContests = () => {
        return Promise.all([ getContestsWithIds(), getSameDayPrecinctsWithStatus() ])
          .then(([ contestsWithIds, sameDayPrecinctStatusesByContests ]) => {
            return contestsWithIds.map(([ contestName, contestId ]) => {
              const contestPrecincts = sameDayPrecinctStatusesByContests.find(c => c.key === contestId).pds;

              return [
                contestName,
                contestId,
                contestPrecincts.filter(p => p.status === 2).length,
                contestPrecincts.length
              ];
            });
          });
      };

      Promise.all([ getResults(), getSameDayPrecinctStatusesByContests() ])
        .then(([ contestResults, sameDayPrecinctStatusesByContests ]) => {
          const demLeadingCount = contestResults.filter((result) => {
            const sortedCandidates = result.candidates.sort((a, b) => b[1] - a[1]);
            return sortedCandidates[0][0].includes('DEM') || sortedCandidates[0][0].includes('WOR');
          }).length;

          $('td#tonight-dem').text(demLeadingCount);
          $('td#tonight-rep').text(17 - demLeadingCount);

          for (var result of contestResults) {
            const districtNumber = result.name.match(/County Legislator (\d+)\w+ District \(Vote for 1\)/)[1];

            const resultCandidatesHTML = result.candidates.map(candidate =>
              `<li class="list-group-item">${candidate[0]}; ${candidate[1].toLocaleString()}; ${candidate[2]}%</li>`);

            const contestPrecincts = sameDayPrecinctStatusesByContests.find(c => c[0] === result.name.split(' (')[0]);

            const elex25Margin = elex25Margins[`D${districtNumber}`] || 'Uncontested';
            const currentElexMargin = result.candidates[0][2] - result.candidates.slice(1).reduce((acc, c) => c[2] + acc, 0);
            const currentElexMarginPrefix = currentElexMargin < 0 ? 'R' : 'D';

            const currentElexMarginDetails = result.candidates.length === 2 ? 'Uncontested' : `${currentElexMarginPrefix}+${currentElexMargin.toLocaleString()}`;

            const resultHTML = `
              <div class="col-md-4">
                <div class="card">
                  <div class="card-header">
                    <b>District ${districtNumber} (${contestPrecincts[2]}/${contestPrecincts[3]} precincts)</b>
                  </div>
                  <ul class="list-group list-group-flush">
                    ${resultCandidatesHTML.join('\n')}
                    <li class="list-group-item">(YOY change: ${elex25Margin} ... ${currentElexMarginDetails})</li>
                  </ul>
                </div>
              </div>
            `;

            if (contestResults.indexOf(result) % 3 === 0) {
              $('body.container').append(`<div class="row mb-4"></div>`);
            }

            $('div.row').last().append(resultHTML);
          }
        });
    });
  </script>
</body>
