<!DOCTYPE html>
<head>
  <title>apcall</title>
  <meta http-equiv="Refresh" content="30" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div class="container">
    <h3>apcall</h3>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Race</th>
          <th>Estimated vote % in</th>
          <th>Winner</th>
          <th>Call time</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script>
  // ** CHANGE THIS ** //
  const raceDate = '2024-11-05'; // '2026-06-23'; // '2024-11-05'; '2023-05-16';
  const raceConfigs = [
    // { id: 'NY-G-G-2024-11-05', name: 'Hochul/Blakeman' },
    // { id: 'NY-G-C-2024-11-05', name: 'DiNapoli' },
    // { id: 'NY-G-AG-2024-11-05', name: 'James' },
    { id: 'NY-G-H-21-2024-11-05', name: 'Constantino/Gendebien' },
    { id: 'NY-G-H-22-2024-11-05', name: 'Mannion/Buller' },
    { id: 'NY-G-H-24-2024-11-05', name: 'Tenney/Ellman' },
    { id: 'NY-G-SS-48-2024-11-05', name: 'May/McCarron' },
    { id: 'NY-G-SS-50-2024-11-05', name: 'Ryan/Corl' },
    { id: 'NY-G-SH-126-2024-11-05', name: 'Lemondes/Phillips' },
    { id: 'NY-G-SH-127-2024-11-05', name: 'Stirpe' },
    { id: 'NY-G-SH-128-2024-11-05', name: 'Hunter' },
    { id: 'NY-G-SH-129-2024-11-05', name: 'Brown/Fiato' },
    // 'PA-D-chief_executive-allegheny-2023-05-16'
  ];
  // ** ** //

  fetch(`https://static01.nyt.com/elections-assets/pages/data/${raceDate}/results-new-york.json`)
    .then((r) => r.json())
    .then((r) => {
      raceConfigs.forEach((raceConfig) => {
        const race = r.races.find((r) => r.nyt_id == raceConfig.id);

        let winnerText = '';
        if (race.outcome.won.length > 0) {
          winnerText = race.candidate_metadata[race.outcome.won[0]].last_name;
          // alert(winnerText);
        }

        const table = document.getElementsByTagName('tbody')[0];
        table.innerHTML = `
          ${table.innerHTML}
          <tr>
            <td>${race.office} ${race.seat_number ? race.seat_number : ''} (${raceConfig.name})</td>
            <td>${race.top_reporting_unit.eevp === null ? 'n/a' : race.top_reporting_unit.eevp}</td>
            <td>${winnerText}</td>
            <td>${race.outcome.winner_accepted_at.length > 0 ? new Date(race.outcome.winner_accepted_at[0]).toLocaleString() : ''}</td>
          </tr>`;
      });
    });
  </script>
</body>
